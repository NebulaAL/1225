services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fwdata
      MYSQL_USER: fwdata
      MYSQL_PASSWORD: ${DB_PASSWORD:?请填写 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请填写 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u fwdata -D fwdata -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/fwdata?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
      DB_USER: fwdata
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请填写 ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
volumes:
  mysql-data:
