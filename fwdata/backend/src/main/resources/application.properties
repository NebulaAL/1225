spring.application.name=fwdata
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/fwdata?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:fwdata}
spring.datasource.password=${DB_PASSWORD}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=FWDATA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
fwdata.admin.username=${ADMIN_USERNAME:admin}
fwdata.admin.password=${ADMIN_PASSWORD:}
